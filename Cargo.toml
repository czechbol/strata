[package]
name = "strata"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
profiling = ["pprof"]

[dependencies]
pprof = { version = "0.15", features = ["flamegraph"], optional = true }
anyhow              = "1"
dirs                = "6"
bincode             = "1"
chrono              = "0.4"
clap                = { version = "4", features = ["derive"] }
git2                = { version = "0.20", features = ["vendored-libgit2", "ssh"] }
indicatif           = "0.18"
rayon               = "1"
rustc-hash          = "2"
regex               = "1"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
rmp-serde           = "1"
sled                = "0.34"
tracing             = "0.1"
tracing-subscriber  = { version = "0.3", features = ["env-filter"] }
