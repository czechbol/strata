name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
            os: linux
            artifact: linux-x64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os: linux
            artifact: linux-arm64
          - target: aarch64-apple-darwin
            runner: macos-latest
            os: macos
            artifact: macos-arm64
          - target: x86_64-pc-windows-msvc
            runner: windows-latest
            os: windows
            artifact: windows-x64

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Stage binary (Unix)
        if: matrix.os != 'windows'
        shell: bash
        run: |
          BINARY="strata-${{ matrix.artifact }}"
          cp target/${{ matrix.target }}/release/strata "$BINARY"
          sha256sum "$BINARY" > "${BINARY}.sha256"
          echo "BINARY=$BINARY" >> $GITHUB_ENV

      - name: Stage binary (Windows)
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $binary = "strata-${{ matrix.artifact }}.exe"
          Copy-Item "target/${{ matrix.target }}/release/strata.exe" $binary
          $hash = (Get-FileHash $binary -Algorithm SHA256).Hash.ToLower()
          "$hash  $binary" | Out-File -Encoding ascii "${binary}.sha256"
          echo "BINARY=$binary" >> $env:GITHUB_ENV

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: strata-${{ matrix.artifact }}
          path: |
            ${{ env.BINARY }}
            ${{ env.BINARY }}.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
